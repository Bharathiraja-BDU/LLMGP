data:
  dataset: cora
  root: ./data
  num_classes: 7
  num_features: 1433
  num_support_per_class: 1
  num_query_per_class: 15
  split:
    config: revised_self_supervised_3_2_2
    seed: 2026
    train_classes: [0, 1, 2]
    val_classes: [3, 4]
    test_classes: [5, 6]
    class_id_to_topic:
      0: Theory
      1: Reinforcement Learning
      2: Genetic Algorithms
      3: Neural Networks
      4: Probabilistic Methods
      5: Case-Based Reasoning
      6: Rule Learning
model:
  llm_model: allenai/scibert_scivocab_uncased
  embedding_dim: 768
  feature_dim: 1433
  hidden_dim: 256
  temperature: 0.1
  max_tokens: 512
  batch_size: 64
training:
  max_epochs: 50
  episodes_per_epoch: 100
  lr: 0.001
  weight_decay: 0.0001
  patience: 10
  seed: 42
  eval_seeds: [11, 23, 37, 53, 71]
  shots: [1, 3, 5, 10]
  test_episodes: 600
  validation_episodes: 30
pretraining:
  objective: masked_feature_reconstruction_mse
  epochs: 100
  mask_probability: 0.15
  learning_rate: 0.001
  weight_decay: 0.0001
  graph_visibility: all_node_features_and_edges_no_node_labels
